# Builds OMEN Hub RS and publishes a GitHub release with the installer
# whenever a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Installer
        shell: pwsh
        run: ./installer/build.ps1 -NoBuild

      - name: Portable zip
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/omen-hub.exe, target/release/omen.exe, README.md, LICENSE dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/OMEN-Hub-RS-$v-portable.zip" -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OMEN-Hub-RS-Setup-*.exe
            dist/OMEN-Hub-RS-*-portable.zip
          generate_release_notes: true
