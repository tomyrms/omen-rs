[package]
name = "omen-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OMEN Hub RS: GUI dashboard, fan curve editor and monitoring tray"

[lib]
name = "omen_gui"
path = "src/lib.rs"

[[bin]]
name = "omen-hub"
path = "src/bin/omen-hub.rs"

[dependencies]
eframe = "0.36.2"
egui_plot = "0.37.0"
omen-wmi = { version = "0.1.0", path = "../omen-wmi", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
