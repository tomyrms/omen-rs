[package]
name = "omen-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OMEN control logic: modes, automatic mode, sensors, game detection, autostart"

[dependencies]
omen-wmi = { version = "0.1.0", path = "../omen-wmi", features = ["serde"] }
omen-kbd = { version = "0.1.0", path = "../omen-kbd" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
