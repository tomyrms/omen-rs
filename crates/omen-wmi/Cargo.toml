[package]
name = "omen-wmi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HP BIOS WMI control client for OMEN laptops (root\\WMI hpqBIntM / hpqBIOSInt)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Wmi", "Win32_System_Variant", "Win32_Foundation", "Win32_Security", "Win32_System_Rpc"] }

[features]
serde = ["dep:serde"]
